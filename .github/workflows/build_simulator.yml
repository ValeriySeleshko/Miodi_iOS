      - name: Build for iOS Simulator (iPhone 15 Pro)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Miodi.xcodeproj \
            -scheme Miodi \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|fatal error:|BUILD FAILED" || true

          if grep -q "BUILD FAILED" build.log; then
            echo "::error::Xcode build failed. Showing all errors below:"
            grep -C 3 -E "error:" build.log
            exit 1
          fi
