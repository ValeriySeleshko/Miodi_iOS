name: Build Miodi iOS Simulator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build iOS Simulator App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for iOS Simulator (iPhone 15 Pro)
        run: |
          xcodebuild build \
            -project Miodi.xcodeproj \
            -scheme Miodi \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Compress Simulator .app for Appetize.io
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r -X ../../../../Miodi_Simulator.zip Miodi.app
          echo "Simulator build zipped successfully."

      - name: Upload Artifact (Miodi_Simulator.zip)
        uses: actions/upload-artifact@v4
        with:
          name: Miodi_Simulator
          path: Miodi_Simulator.zip
          retention-days: 7
