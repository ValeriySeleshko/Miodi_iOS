name: Miodi
options:
  bundleIdPrefix: com.miodi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.10"
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  DEVELOPMENT_TEAM: ""

targets:
  Miodi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Models
      - path: Services
      - path: Views
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.miodi.app
      MARKETING_VERSION: "1.0.393"
      CURRENT_PROJECT_VERSION: "558"
      INFOPLIST_KEY_CFBundleDisplayName: "Miodi"
      INFOPLIST_KEY_NSFaceIDUsageDescription: "Защита данных женского календаря и личных записей с помощью Face ID"
      INFOPLIST_KEY_NSCameraUsageDescription: "Прикрепление фото к задачам и создание полароидных снимков"
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Выбор фото из галереи для вложений в задачи и сохранения открыток"
      INFOPLIST_KEY_UIAppFonts:
        - "caveat.ttf"
        - "neucha.ttf"
        - "bad_script.ttf"
        - "marck_script.ttf"
        - "comfortaa.ttf"
        - "pt_serif.ttf"
        - "pt_serif_bold.ttf"
        - "roboto.ttf"
        - "lora.ttf"
        - "montserrat.ttf"
        - "inter.ttf"
        - "open_sans.ttf"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      GENERATE_INFOPLIST_FILE: YES
